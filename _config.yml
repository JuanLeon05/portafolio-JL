title: JL | Wearables
description: Portafolio de Ingeniería Mecatrónica & Wearables
author: Juan León

# ... deja el resto igual ...
# GitHub Pages: modo recomendado
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# IMPORTANTES:
# - Para GitHub Pages (Project Page), edita:
url: "https://JuanLeon05.github.io/"
baseurl: "/portafolio-JL"

#Configuracion Formato, Header y Footer
just_the_docs:
  # incluir CSS adicional
  custom_css:
    - "assets/css/custom.css"
  footer_content: "Copyright &copy; 2026 IBERO. Juan León. This work is licensed under <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a>. <a href='/uso-ia'>Uso de IA</a>"

search_enabled: true
search:
  # Cambia el numero dependiendo el numero de subniveles de páginas, poner 1 por default
  heading_level: 2

# Ejemplo de enlace auxiliar (aparece arriba a la derecha)
aux_links:
  "Repositorio en GitHub":
    - "https://github.com/JuanLeon05/portafolio-JL"

# Enlaces
permalink: pretty

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
